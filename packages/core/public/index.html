<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Generic fallback head. linklist.js replaces this with the per-profile
         title / Open Graph / Twitter / JSON-LD from config.json at runtime. -->
    <title>links</title>
    <meta name="theme-color" content="#6750a4">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.css">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script type="module"
      src="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.js"></script>
  </head>
  <body class="auto">
    <div id="app">
      <noscript>
        <main class="linklist">
          <p>This link list needs JavaScript enabled to load <code>config.json</code>.</p>
        </main>
      </noscript>
    </div>
    <script type="module" src="./linklist.js"></script>
  </body>
</html>
